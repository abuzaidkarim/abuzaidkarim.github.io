<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="Karim Abuzaid">
  <meta name="keywords" content="Staff Software Engineer, Full Stack Developer, Laravel, PHP, React, Node.js, SaaS, Platform Engineering, System Architecture, Karim Abuzaid">

  <!-- Canonical URL -->
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:image" content="{{ page.image | default: '/assets/images/og-image.jpeg' | absolute_url }}">
  <meta property="og:site_name" content="Karim Abuzaid">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
  <meta name="twitter:image" content="{{ page.image | default: '/assets/images/og-image.jpeg' | absolute_url }}">
  <meta name="twitter:creator" content="@kabuzaid">

  <!-- Robots -->
  <meta name="robots" content="index, follow">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Karim Abuzaid",
    "url": "{{ site.url }}",
    "jobTitle": "Staff Software Engineer",
    "description": "{{ site.description }}",
    "email": "abuzaid.karim@gmail.com",
    "sameAs": [
      "https://github.com/vercryger",
      "https://linkedin.com/in/kabuzaid"
    ]
  }
  </script>
</head>
<body>
  {{ content }}
</body>
</html>
