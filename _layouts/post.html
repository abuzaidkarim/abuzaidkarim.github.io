---
layout: default
---
<main class="max-w-2xl mx-auto px-4 py-12">
  <header class="mb-12">
    <a href="/posts" class="text-muted-foreground hover:text-foreground">
      &larr; back to posts
    </a>
    <h1 class="text-lg mt-4">{{ page.title }}</h1>
    <time class="text-muted-foreground text-sm">{{ page.date | date: "%Y-%m-%d" }}</time>
  </header>

  <article class="prose">
    {{ content }}
  </article>

  <footer class="mt-12 pt-8 border-t border-border">
    <a href="/" class="text-muted-foreground hover:text-foreground">
      &larr; home
    </a>
  </footer>
</main>
